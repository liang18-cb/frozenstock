<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrozenStock – Manajemen Stok Frozen Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e2a35;--frost:#f2f7f9;--ice:#cfe8f0;--line:#d5e2e8;--amber:#b86e00;--amberbg:#fdf0d8;--red:#b83a2e;--redbg:#fbe4e1;--ok:#1f7a5c;--okbg:#dff3ea;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--frost);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
header{background:var(--ink);color:#fff;padding:18px 20px 0}
.top{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
h1{font-size:28px;letter-spacing:-.5px}
.sub{color:var(--ice);font-size:13px;margin-top:2px}
nav{max-width:1100px;margin:14px auto 0;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;color:var(--ice);padding:10px 16px;font:500 14px "IBM Plex Sans",sans-serif;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav button.on{background:var(--frost);color:var(--ink)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2b8fb3;outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
h2{font-size:20px;margin-bottom:12px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font:700 28px "Bricolage Grotesque",sans-serif}
.stat span{color:#4d6a76;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px;align-items:start}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:#4d6a76;border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #edf3f5;vertical-align:middle}
td.n,th.n{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--amberbg);color:var(--amber)}.bad{background:var(--redbg);color:var(--red)}.info{background:#e1eef4;color:#1d5d78}
.meter{width:120px;height:8px;background:#e6eff2;border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#4d6a76}
input,select{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid #b9ccd4;border-radius:7px;background:#fff}
button.go{font:500 14px "IBM Plex Sans",sans-serif;background:var(--ink);color:#fff;border:0;border-radius:7px;padding:10px 16px;cursor:pointer;align-self:end}
button.go:hover{background:#17414f}
button.go:disabled{opacity:.4;cursor:not-allowed}
button.lnk{background:none;border:0;color:var(--red);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:14px}
.msg.e{background:var(--redbg);color:var(--red)}.msg.s{background:var(--okbg);color:var(--ok)}
.empty{color:#4d6a76;padding:10px 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.reset{background:none;border:1px solid #6d8c98;color:var(--ice);border-radius:7px;padding:6px 12px;cursor:pointer;font:13px "IBM Plex Sans",sans-serif}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.login{max-width:380px;margin:40px auto}
.login form{grid-template-columns:1fr}
.demo{color:#4d6a76;font-size:13px;margin:0}
</style>
</head>
<body>
<header>
<div class="top">
<div><h1>FrozenStock</h1><div class="sub">Stok frozen food per batch, urut kedaluwarsa (FEFO)</div></div>
<div class="who" id="who"></div>
</div>
<nav id="nav"></nav>
</header>
<main id="view"></main>
<script>
const KEY='frozenstock-v2';
const SKEY='frozenstock-user';
const PERM={owner:['dashboard','fefo','jual','beli','riwayat','pengguna'],pegawai:['dashboard','fefo','jual','riwayat']};
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const base=()=>({
P:[{id:1,n:'Fiesta Chicken Nugget',c:'Nugget',u:'pack',p:35000,m:10},{id:2,n:'Belfoods Sosis Ayam',c:'Sosis',u:'pack',p:28000,m:10},{id:3,n:'Dimsum Ayam Udang',c:'Dimsum',u:'pack',p:32000,m:8}],
B:[{id:1,pid:1,wh:'Freezer Utama',no:'B001',prod:'2026-10-20',exp:'2026-12-20',init:50,av:45},{id:2,pid:2,wh:'Freezer Utama',no:'B002',prod:'2026-10-25',exp:'2027-03-25',init:40,av:40},{id:3,pid:3,wh:'Freezer Display',no:'B003',prod:'2026-10-28',exp:'2027-01-28',init:30,av:28}],
M:[{id:1,bid:1,t:'IN',d:'2026-11-01 09:00',q:50,x:'Penerimaan barang dari PO 1'},{id:2,bid:2,t:'IN',d:'2026-11-01 09:00',q:40,x:'Penerimaan barang dari PO 1'},{id:3,bid:3,t:'IN',d:'2026-11-01 09:00',q:30,x:'Penerimaan barang dari PO 1'},{id:4,bid:1,t:'OUT',d:'2026-11-05 10:30',q:5,x:'Penjualan sales 1'},{id:5,bid:3,t:'OUT',d:'2026-11-05 10:30',q:2,x:'Penjualan sales 1'}],
S:[{id:1,cu:'Rina Marlina',d:'2026-11-05 10:30',py:'QRIS',st:'Completed',it:[{bid:1,pid:1,q:5,pr:35000},{bid:3,pid:3,q:2,pr:32000}]}],
O:[{id:1,sp:'PT Sumber Beku Makmur',d:'2026-11-01',tot:3590000,n:3}]
});
const USERS=()=>[{id:1,un:'owner01',nm:'Budi Santoso',role:'owner',h:'43a0d17178a9d26c9e0fe9a74b0b45e38d32f27aed887a008a54bf6e033bf7b9'},{id:2,un:'pegawai01',nm:'Siti Rahma',role:'pegawai',h:'ddf13b95f038a3a8bd3e520347dc38ee4f4e6b5055eed182a49d18aa2cdaf2dc'},{id:3,un:'pegawai02',nm:'Andi Wijaya',role:'pegawai',h:'ddf13b95f038a3a8bd3e520347dc38ee4f4e6b5055eed182a49d18aa2cdaf2dc'}];
const seed=()=>{const s=base();s.U=USERS();s.M.forEach(m=>{m.u=m.t==='IN'?'Andi Wijaya':'Siti Rahma'});s.S.forEach(x=>{x.u='Siti Rahma'});s.O.forEach(x=>{x.u='Andi Wijaya'});return s};
let D;
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){D=null}
if(!D||!D.P||!D.U)D=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const SUP=['PT Sumber Beku Makmur','CV Laut Segar'];
const CUS=['Rina Marlina','Dedi Kurniawan','Umum'];
const WH=['Freezer Utama','Freezer Display'];
const PAY=['Cash','Transfer','QRIS','Debit'];
let tab='dashboard',cart=[],msg=null,cu='Umum',py='Cash',pick=1,me=null;
try{const sid=sessionStorage.getItem(SKEY);me=sid?D.U.find(u=>u.id==sid)||null:null}catch(e){me=null}
const can=t=>!!me&&PERM[me.role].includes(t);
const isOwner=()=>!!me&&me.role==='owner';
const $=s=>document.querySelector(s);
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prod=id=>D.P.find(p=>p.id==id);
const bat=id=>D.B.find(b=>b.id==id);
const tgl=s=>new Date(s.replace(' ','T')).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const dl=e=>Math.round((new Date(e+'T00:00:00')-TODAY)/864e5);
const stok=pid=>D.B.filter(b=>b.pid==pid&&dl(b.exp)>=0).reduce((s,b)=>s+b.av,0);
const nowStr=()=>{const n=new Date(),z=v=>String(v).padStart(2,'0');return `${n.getFullYear()}-${z(n.getMonth()+1)}-${z(n.getDate())} ${z(n.getHours())}:${z(n.getMinutes())}`};
const nid=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
const pill=e=>{const d=dl(e);return d<0?'<span class="pill bad">Kedaluwarsa</span>':d<=30?`<span class="pill warn">${d} hari lagi</span>`:`<span class="pill ok">${d} hari lagi</span>`};
const meter=b=>{const tot=Math.max(1,(new Date(b.exp)-new Date(b.prod))/864e5),left=Math.max(0,dl(b.exp)),pct=Math.min(100,left/tot*100),d=dl(b.exp),c=d<0||d<=14?'#b83a2e':d<=30?'#d58a14':'#2b8fb3';return `<div class="meter" title="Sisa masa simpan"><i style="width:${pct}%;background:${c}"></i></div>`};
function alloc(lines){
const t=D.B.map(b=>({...b})),out=[];
for(const l of lines){
let need=l.q;
const c=t.filter(b=>b.pid==l.pid&&b.av>0&&dl(b.exp)>=0).sort((a,b)=>a.exp<b.exp?-1:a.exp>b.exp?1:a.id-b.id);
const have=c.reduce((s,b)=>s+b.av,0);
if(have<need)return{err:`Stok ${prod(l.pid).n} tidak cukup (tersedia ${have}, diminta ${need}).`};
for(const b of c){if(!need)break;const k=Math.min(b.av,need);b.av-=k;need-=k;out.push({bid:b.id,pid:l.pid,q:k,pr:prod(l.pid).p})}
}
return{out};
}
function addCart(e){
e.preventDefault();
const q=parseInt($('#qt').value,10),pid=+$('#pr').value;
if(!(q>0)){msg=['e','Jumlah harus lebih dari 0.'];return render()}
const r=alloc([...cart,{pid,q}]);
if(r.err){msg=['e',r.err];return render()}
const x=cart.find(c=>c.pid==pid);
if(x)x.q+=q;else cart.push({pid,q});
msg=null;render();
}
function delCart(i){cart.splice(i,1);msg=null;render()}
function saveSale(){
if(!me)return;
const r=alloc(cart);
if(r.err){msg=['e',r.err];return render()}
const id=nid(D.S),d=nowStr();
r.out.forEach(l=>{
bat(l.bid).av-=l.q;
D.M.push({id:nid(D.M),bid:l.bid,t:'OUT',d,q:l.q,x:'Penjualan sales '+id,u:me.nm});
});
D.S.push({id:id,cu,d,py,st:'Completed',it:r.out,u:me.nm});
cart=[];msg=['s',`Penjualan #${id} tersimpan. Stok batch berkurang otomatis.`];
save();render();
}
function cancelSale(id){
const s=D.S.find(x=>x.id==id);
if(!isOwner()||!s||s.st==='Cancelled')return;
s.st='Cancelled';
const d=nowStr();
s.it.forEach(l=>{
bat(l.bid).av+=l.q;
D.M.push({id:nid(D.M),bid:l.bid,t:'ADJUSTMENT',d,q:l.q,x:'Pembatalan sales '+id,u:me.nm});
});
msg=['s',`Penjualan #${id} dibatalkan. Stok dikembalikan ke batch asal.`];
save();render();
}
function addPurchase(e){
e.preventDefault();
if(!isOwner())return;
const f=k=>$('#'+k).value.trim();
const pid=+f('bp'),no=f('bn'),pd=f('bd'),ex=f('be'),q=parseInt(f('bq'),10),pr=parseFloat(f('bh'));
if(!no||!ex||!(q>0)||!(pr>=0)){msg=['e','Lengkapi nomor batch, tanggal kedaluwarsa, jumlah, dan harga beli.'];return render()}
if(pd&&ex<=pd){msg=['e','Tanggal kedaluwarsa harus setelah tanggal produksi.'];return render()}
if(D.B.some(b=>b.pid==pid&&b.no.toLowerCase()===no.toLowerCase())){msg=['e',`Batch ${no} sudah ada untuk produk ini.`];return render()}
const bid=nid(D.B),oid=nid(D.O),d=nowStr();
D.B.push({id:bid,pid,wh:f('bw'),no,prod:pd||ex,exp:ex,init:q,av:q});
D.M.push({id:nid(D.M),bid,t:'IN',d,q,x:'Penerimaan barang dari PO '+oid,u:me.nm});
D.O.push({id:oid,sp:f('bs'),d:d.slice(0,10),tot:q*pr,n:1,u:me.nm});
pick=pid;msg=['s',`Pembelian #${oid} tersimpan. Batch ${esc(no)} masuk dengan stok ${q}.`];
save();render();
}
function resetData(){
if(!isOwner()||!confirm('Kembalikan semua data ke data contoh awal?'))return;
D=seed();me=D.U.find(u=>u.id==me.id);cart=[];msg=null;save();render();
}
function go(t){if(!can(t))return;tab=t;msg=null;render()}
const msgHtml=()=>msg?`<div class="msg ${msg[0]}" role="status">${msg[1]}</div>`:'';
const opts=(a,sel)=>a.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('');
const prodOpts=(sel,withStock)=>D.P.map(p=>`<option value="${p.id}"${p.id==sel?' selected':''}>${esc(p.n)}${withStock?` (stok ${stok(p.id)})`:''}</option>`).join('');
const V={
dashboard(){
const act=D.B.filter(b=>b.av>0);
const soon=act.filter(b=>dl(b.exp)<=30).sort((a,b)=>a.exp<b.exp?-1:1);
const low=D.P.filter(p=>stok(p.id)<=p.m);
const total=D.P.reduce((s,p)=>s+stok(p.id),0);
return `<div class="strip">
<div class="stat"><b>${total}</b><span>Total stok layak jual</span></div>
<div class="stat"><b>${act.length}</b><span>Batch masih ada isinya</span></div>
<div class="stat"><b>${soon.length}</b><span>Batch kedaluwarsa ≤ 30 hari</span></div>
<div class="stat"><b>${low.length}</b><span>Produk di bawah stok minimum</span></div></div>
<div class="grid2">
<section><h2>Jual duluan</h2>${soon.length?`<div class="wrap"><table><tr><th>Produk</th><th>Batch</th><th>Sisa</th><th class="n">Stok</th></tr>${soon.map(b=>`<tr><td>${esc(prod(b.pid).n)}</td><td>${esc(b.no)}</td><td>${pill(b.exp)}</td><td class="n">${b.av}</td></tr>`).join('')}</table></div>`:'<p class="empty">Tidak ada batch yang mendekati kedaluwarsa.</p>'}</section>
<section><h2>Stok menipis</h2>${low.length?`<div class="wrap"><table><tr><th>Produk</th><th class="n">Stok</th><th class="n">Minimum</th></tr>${low.map(p=>`<tr><td>${esc(p.n)}</td><td class="n"><span class="pill bad">${stok(p.id)}</span></td><td class="n">${p.m}</td></tr>`).join('')}</table></div>`:'<p class="empty">Semua produk masih di atas stok minimum.</p>'}</section>
</div>
<section style="margin-top:22px"><h2>Stok per produk</h2><div class="wrap"><table><tr><th>Produk</th><th>Kategori</th><th class="n">Harga jual</th><th class="n">Stok layak jual</th><th class="n">Minimum</th><th>Status</th></tr>${D.P.map(p=>{const s=stok(p.id);return `<tr><td>${esc(p.n)}</td><td>${esc(p.c)}</td><td class="n">${rp(p.p)}</td><td class="n">${s} ${esc(p.u)}</td><td class="n">${p.m}</td><td>${s<=p.m?'<span class="pill bad">Perlu restock</span>':'<span class="pill ok">Aman</span>'}</td></tr>`}).join('')}</table></div></section>`;
},
fefo(){
const rows=[...D.B].sort((a,b)=>a.exp<b.exp?-1:a.exp>b.exp?1:a.id-b.id);
return `<section><h2>Urutan jual per batch (FEFO)</h2><p class="empty" style="margin-top:-6px">Batch yang paling cepat kedaluwarsa dijual lebih dulu. Penjualan memilih batch dengan urutan ini secara otomatis.</p><div class="wrap"><table><tr><th>Produk</th><th>Batch</th><th>Gudang</th><th>Kedaluwarsa</th><th>Masa simpan</th><th>Status</th><th class="n">Tersedia</th></tr>${rows.map(b=>`<tr><td>${esc(prod(b.pid).n)}</td><td>${esc(b.no)}</td><td>${esc(b.wh)}</td><td>${tgl(b.exp)}</td><td>${meter(b)}</td><td>${pill(b.exp)}</td><td class="n">${b.av} / ${b.init}</td></tr>`).join('')}</table></div></section>`;
},
jual(){
const pv=alloc(cart),lines=pv.out||[];
const sal=[...D.S].reverse();
return `${msgHtml()}<div class="grid2"><section><h2>Penjualan baru</h2>
<form onsubmit="addCart(event)">
<label>Pelanggan<select onchange="cu=this.value">${opts(CUS,cu)}</select></label>
<label>Pembayaran<select onchange="py=this.value">${opts(PAY,py)}</select></label>
<label>Produk<select id="pr" onchange="pick=+this.value">${prodOpts(pick,true)}</select></label>
<label>Jumlah<input id="qt" type="number" min="1" value="1" required></label>
<button class="go">Tambah ke keranjang</button></form>
${cart.length?`<div class="wrap"><table><tr><th>Produk</th><th class="n">Jumlah</th><th></th></tr>${cart.map((c,i)=>`<tr><td>${esc(prod(c.pid).n)}</td><td class="n">${c.q}</td><td class="n"><button class="lnk" onclick="delCart(${i})">Hapus</button></td></tr>`).join('')}</table></div>
<p class="empty">Diambil dari: ${lines.map(l=>`${esc(bat(l.bid).no)} ×${l.q}`).join(', ')}</p>
<div class="foot"><b>Total ${rp(lines.reduce((s,l)=>s+l.q*l.pr,0))}</b><button class="go" onclick="saveSale()">Simpan penjualan</button></div>`:'<p class="empty">Keranjang masih kosong. Pilih produk lalu tambahkan.</p>'}</section>
<section><h2>Riwayat penjualan</h2><div class="wrap"><table><tr><th>No</th><th>Tanggal</th><th>Pelanggan</th><th>Kasir</th><th>Item</th><th class="n">Total</th><th>Status</th><th></th></tr>${sal.map(s=>`<tr><td>#${s.id}</td><td>${tgl(s.d)}</td><td>${esc(s.cu)}</td><td>${esc(s.u||'-')}</td><td>${s.it.map(l=>`${esc(prod(l.pid).n)} ×${l.q}`).join('<br>')}</td><td class="n">${rp(s.it.reduce((t,l)=>t+l.q*l.pr,0))}</td><td>${s.st==='Cancelled'?'<span class="pill bad">Dibatalkan</span>':'<span class="pill ok">Selesai</span>'}</td><td>${s.st==='Cancelled'||!isOwner()?'':`<button class="lnk" onclick="cancelSale(${s.id})">Batalkan</button>`}</td></tr>`).join('')}</table></div></section></div>`;
},
beli(){
const next=new Date(TODAY);next.setMonth(next.getMonth()+6);
const z=v=>String(v).padStart(2,'0'),ds=d=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
return `${msgHtml()}<div class="grid2"><section><h2>Terima barang dari supplier</h2>
<form onsubmit="addPurchase(event)">
<label>Supplier<select id="bs">${opts(SUP)}</select></label>
<label>Produk<select id="bp">${prodOpts(pick)}</select></label>
<label>Gudang<select id="bw">${opts(WH)}</select></label>
<label>Nomor batch<input id="bn" placeholder="B004" required></label>
<label>Tanggal produksi<input id="bd" type="date" value="${ds(TODAY)}"></label>
<label>Tanggal kedaluwarsa<input id="be" type="date" value="${ds(next)}" required></label>
<label>Jumlah<input id="bq" type="number" min="1" value="20" required></label>
<label>Harga beli<input id="bh" type="number" min="0" value="25000" required></label>
<button class="go">Simpan pembelian</button></form></section>
<section><h2>Riwayat pembelian</h2><div class="wrap"><table><tr><th>No</th><th>Tanggal</th><th>Supplier</th><th>Petugas</th><th class="n">Item</th><th class="n">Total</th></tr>${[...D.O].reverse().map(o=>`<tr><td>#${o.id}</td><td>${tgl(o.d)}</td><td>${esc(o.sp)}</td><td>${esc(o.u||'-')}</td><td class="n">${o.n}</td><td class="n">${rp(o.tot)}</td></tr>`).join('')}</table></div></section></div>`;
},
riwayat(){
return `<section><h2>Riwayat pergerakan stok</h2><div class="wrap"><table><tr><th>Waktu</th><th>Produk</th><th>Batch</th><th>Jenis</th><th class="n">Jumlah</th><th>Keterangan</th><th>Oleh</th></tr>${[...D.M].reverse().map(m=>{const b=bat(m.bid);return `<tr><td>${tgl(m.d)} ${m.d.slice(11)}</td><td>${esc(prod(b.pid).n)}</td><td>${esc(b.no)}</td><td><span class="pill ${m.t==='IN'?'ok':m.t==='OUT'?'info':'warn'}">${m.t}</span></td><td class="n">${m.q}</td><td>${esc(m.x)}</td><td>${esc(m.u||'-')}</td></tr>`}).join('')}</table></div></section>`;
},
pengguna(){
return `${msgHtml()}<div class="grid2"><section><h2>Tambah pegawai</h2>
<form onsubmit="addUser(event)">
<label>Nama lengkap<input id="un_nm" required></label>
<label>Username<input id="un_un" autocomplete="off" required></label>
<label>Password<input id="un_pw" type="password" minlength="6" autocomplete="new-password" required></label>
<button class="go">Simpan pegawai</button></form></section>
<section><h2>Daftar pengguna</h2><div class="wrap"><table><tr><th>Nama</th><th>Username</th><th>Peran</th><th></th></tr>${D.U.map(u=>`<tr><td>${esc(u.nm)}</td><td>${esc(u.un)}</td><td><span class="pill ${u.role==='owner'?'warn':'info'}">${u.role==='owner'?'Owner':'Pegawai'}</span></td><td>${u.role==='pegawai'?`<button class="lnk" onclick="delUser(${u.id})">Hapus</button>`:''}</td></tr>`).join('')}</table></div></section></div>`;
}
};
const TABS=[['dashboard','Dashboard'],['fefo','Batch & kedaluwarsa'],['jual','Penjualan'],['beli','Pembelian'],['riwayat','Riwayat stok'],['pengguna','Pengguna']];
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(e){
e.preventDefault();
const name=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value;
let h;
try{h=await sha(pw)}catch(err){msg=['e','Login butuh koneksi aman. Buka lewat https atau localhost.'];return render()}
const u=D.U.find(x=>x.un===name);
if(!u||u.h!==h){msg=['e','Username atau password salah.'];return render()}
me=u;tab='dashboard';msg=null;
try{sessionStorage.setItem(SKEY,u.id)}catch(err){}
render();
}
function logout(){
me=null;cart=[];msg=null;
try{sessionStorage.removeItem(SKEY)}catch(err){}
render();
}
async function addUser(e){
e.preventDefault();
if(!isOwner())return;
const nm=$('#un_nm').value.trim(),name=$('#un_un').value.trim().toLowerCase(),pw=$('#un_pw').value;
if(!nm||!name||pw.length<6){msg=['e','Isi nama, username, dan password minimal 6 karakter.'];return render()}
if(D.U.some(x=>x.un===name)){msg=['e',`Username ${esc(name)} sudah dipakai.`];return render()}
const h=await sha(pw);
D.U.push({id:nid(D.U),un:name,nm,role:'pegawai',h});
msg=['s',`Pegawai ${esc(nm)} ditambahkan. Username: ${esc(name)}.`];
save();render();
}
function delUser(id){
const u=D.U.find(x=>x.id==id);
if(!isOwner()||!u||u.role!=='pegawai')return;
if(!confirm(`Hapus akun ${u.nm}? Riwayat transaksinya tetap tersimpan.`))return;
D.U=D.U.filter(x=>x.id!=id);
msg=['s',`Akun ${esc(u.nm)} dihapus.`];
save();render();
}
const loginView=()=>`<section class="login"><h2>Masuk</h2>${msgHtml()}<form onsubmit="login(event)"><label>Username<input id="lu" autocomplete="username" required></label><label>Password<input id="lp" type="password" autocomplete="current-password" required></label><button class="go">Masuk</button></form><p class="demo">Akun contoh: owner01 / owner123 (Owner), pegawai01 / pegawai123 (Pegawai).</p></section>`;
function render(){
if(!me){
$('#nav').innerHTML='';$('#who').innerHTML='';
$('#view').innerHTML=loginView();
return;
}
if(!can(tab))tab='dashboard';
$('#who').innerHTML=`<span>${esc(me.nm)} <span class="pill info">${me.role==='owner'?'Owner':'Pegawai'}</span></span>${isOwner()?'<button class="reset" onclick="resetData()">Reset data contoh</button>':''}<button class="reset" onclick="logout()">Keluar</button>`;
$('#nav').innerHTML=TABS.filter(t=>can(t[0])).map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
$('#view').innerHTML=V[tab]();
}
render();
</script>
</body>
</html>
